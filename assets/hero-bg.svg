<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="82%" cy="18%" r="60%">
      <stop offset="0%" stop-color="#e0402f" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#e0402f" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#e0402f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1f22"/>
      <stop offset="100%" stop-color="#0e1012"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4f1ea" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#f4f1ea" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- estrada em perspetiva -->
  <g opacity=".5">
    <polygon points="0,900 620,560 980,560 1600,900" fill="#14171a"/>
    <line x1="760" y1="560" x2="720" y2="900" stroke="#e0402f" stroke-width="6" stroke-opacity=".35"/>
    <line x1="840" y1="560" x2="880" y2="900" stroke="#e0402f" stroke-width="6" stroke-opacity=".35"/>
  </g>

  <!-- feixes de farol -->
  <polygon points="1310,120 1600,260 1600,520 1310,300" fill="url(#beam)"/>
  <polygon points="1310,120 1600,40 1600,260" fill="url(#beam)"/>

  <!-- textura diagonal subtil -->
  <g opacity=".05">
    <path d="M0 0 L1600 900 M0 120 L1480 900 M0 240 L1360 900 M0 360 L1240 900 M0 480 L1120 900 M0 600 L1000 900 M0 720 L880 900" stroke="#f4f1ea" stroke-width="2"/>
  </g>
</svg>
